function go(b,t){let h='';if(b==='roadmap')h='roadmap';else if(b){h=encodeURIComponent(b)+(t?'/'+encodeURIComponent(t):'')}if(h)location.hash=h;else{history.pushState(null,'',location.pathname);parse();render()}document.body.classList.remove('nav');window.scrollTo(0,0)}

function nav(){let h=`<div class=logo>cyber<span>scraped</span><br><small>Cybersecurity, curated</small></div><button class="nv${!sel.b&&!sel.rm?' on':''}" data-go=""><b>&#9654;</b>All videos<i>${V.length}</i></button>`;
for(const b of D.tree){const c=list({b:b.id}).length;h+=`<button class="nv${sel.b===b.id?' on':''}${c?'':' z'}" data-b="${b.id}"><b>${b.id}</b>${esc(bn(b))}<i>${c}</i></button>`}
h+=`<button class="nv${sel.rm?' on':''}" data-b="roadmap" style="margin-top:10px"><b>&#9776;</b>Learning roadmap</button>`;
h+=`<details id=lab><summary>What the labels mean</summary><p><b>Community recommended</b>: someone in a public forum recommended this video. <b>Community mention</b>: weaker signal (a list mention or a well-received post), not a direct recommendation. <b>Publisher</b>: official or established training publisher. Labels are not a guarantee of accuracy.</p><p>Views and upload dates are a snapshot checked on 2 Nov 2026, not live. A video with none shown has not been checked yet.</p></details>`;$('#side').innerHTML=h}
function roadmap(){let h='<div id=head><h2>Learning roadmap</h2><p>The full study map. Numbers show videos made for that exact item. Tap a branch or topic to open its videos.</p></div><div class=rm>';
for(const b of D.tree){h+=`<div class=rb><h3><b>${b.id}</b><a data-b="${b.id}">${esc(bn(b))}</a></h3>${b.desc?'<p>'+esc(b.desc)+'</p>':'<p>Learn this once. Every branch builds on it.</p>'}`;
for(const t of b.topics){const tc=list({b:b.id,t:t.name}).length;h+=`<div class=rt><a data-b="${b.id}" data-t="${esc(t.name)}">${esc(t.name)}</a><i>${tc} video${tc==1?'':'s'}</i></div><ul class=ri>${t.items.map(it=>{const n=direct(b.id,t.name,it);return `<li class="${n?'':'zero'}"><em>${n||''}</em>${esc(it)}</li>`}).join('')}</ul>`}h+='</div>'}
$('#main').innerHTML='<div id=top><button id=menu>&#9776; Menu</button><button id=mode aria-label="Switch colour mode" title="Switch light / dark"></button></div>'+h+'</div>'}
function shell(){if(!$('#grid')){$('#main').innerHTML='<div id=top><button id=menu>&#9776; Menu</button><input id=q placeholder="Search videos" aria-label="Search videos"><button id=mode aria-label="Switch colour mode" title="Switch light / dark"></button></div><div id=head></div><div class=chips id=chips></div><div id=grid></div><div id=empty></div>';$('#q').addEventListener('input',feed)}}
function render(){nav();if(sel.rm){roadmap();return}shell();feed()}
function feed(){const br=sel.b?D.tree.find(b=>b.id===sel.b):null;
let ch='';if(br){ch=`<button data-b="${br.id}" class="${!sel.t?'on':''}">All ${esc(bn(br))}<i>${list({b:br.id}).length}</i></button>`+br.topics.map(t=>{const c=list({b:br.id,t:t.name}).length;return `<button data-b="${br.id}" data-t="${esc(t.name)}" class="${sel.t===t.name?'on':''}${c?'':' z'}">${esc(t.name)}<i>${c}</i></button>`}).join('')}
$('#chips').innerHTML=ch;$('#chips').style.display=br?'flex':'none';
let c='<div class=crumb><a data-go="">All videos</a>';if(br){c+=` / <a data-b="${br.id}">${esc(bn(br))}</a>`;if(sel.t)c+=` / ${esc(sel.t)}`}c+='</div>';
const title=sel.t||(br?bn(br):'All videos');const q=$('#q').value.trim();let L=q?V.slice():list(sel);let rel=[];
if(q){const f=sfind(q);const ex=L.filter(v=>f.ex(v));rel=L.filter(v=>!f.ex(v)&&v.cs.some(k=>f.keys.has(k)));rel.sort((a,b)=>f.score(b)-f.score(a));L=ex}
$('#head').innerHTML=c+`<h2>${q?'Search: '+esc(q):esc(title)}</h2><p>${q?L.length+' match'+(L.length==1?'':'es')+(rel.length?', '+rel.length+' related':''):L.length+' video'+(L.length==1?'':'s')}</p>`;
const MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];const fv=n=>n>=1e6?(n/1e6).toFixed(n>=1e7?0:1).replace('.0','')+'M':n>=1e3?(n>=1e5?Math.round(n/1e3):(n/1e3).toFixed(1).replace('.0',''))+'K':String(n);const fd=u=>{const d=new Date(u),n=new Date(),m=(n.getFullYear()-d.getFullYear())*12+n.getMonth()-d.getMonth()-(n.getDate()<d.getDate()?1:0),y=Math.floor(m/12),p=(k,w)=>k+' '+w+(k==1?'':'s')+' ago';if(y>=1)return p(y,'year');if(m>=1)return p(m,'month');const dd=Math.max(0,Math.floor((n-d)/864e5));return dd>=7?p(Math.floor(dd/7),'week'):dd<1?'today':p(dd,'day')};const meta=v=>v.w?`<div class=vm title="Snapshot checked 2 Nov 2026">${fv(v.w)} views &middot; ${fd(v.u)}</div>`:'';const card=(v,i)=>`<button class=card style="--i:${i}" data-v="${v.id}"><div class=th><img loading=lazy alt="" src="https://i.ytimg.com/vi/${v.id}/mqdefault.jpg" onerror="this.remove()"></div><div class=ti>${esc(v.t)}</div><div class=mt>${esc(v.c)}</div>${meta(v)}</button>`;
$('#grid').innerHTML=L.map(card).join('')+(rel.length?'<div class=dv>Related results (broader matches, not necessarily the exact thing you typed)</div>'+rel.map(card).join(''):'');L=L.concat(rel);
const em=$('#empty');if(!L.length){em.style.display='block';em.innerHTML=q?'No videos match that search. Try a shorter or more general word.':`No videos here yet.${br?'<br><button data-b="'+br.id+'">See all '+esc(bn(br))+' videos</button>':''}`}else em.style.display='none'}
function play(id){const v=V.find(x=>x.id===id);if(!v)return;$('#pw').innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="Video player"></iframe>`;$('#mt').textContent=v.t;
$('#mi').innerHTML=`${esc(v.c)} &middot; <span class="chip${v.tier=='Publisher'?' p':''}">${v.tier}</span><div class=mi2>Covers: ${v.s.map(x=>esc(NAME[x[0]]||D.tree.find(b=>b.id===x[0]).name)+' &rarr; '+esc(x[1])+(x[2]?' &rarr; '+esc(x[2]):' (whole topic, not a single item)')).join('<br>')}</div><div class=mi2>Not playing? <a target=_blank rel=noopener href="https://www.youtube.com/watch?v=${id}">Open on YouTube</a></div>`;$('#md').classList.add('on');lastF=document.activeElement;$('#x').focus()}
function shut(){$('#md').classList.remove('on');$('#pw').innerHTML='';if(lastF&&lastF.focus)lastF.focus()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-go],[data-b],[data-v],#x,#menu,#scrim');if(e.target.id==='md'){shut();return}if(!t)return;
if(t.id==='x'){shut();return}if(t.id==='menu'){document.body.classList.add('nav');return}if(t.id==='scrim'){document.body.classList.remove('nav');return}
if(t.dataset.v){play(t.dataset.v);return}if('go' in t.dataset){go();return}go(t.dataset.b,t.dataset.t||null)});
document.addEventListener('click',e=>{if(e.target.closest('#mode')){const r=document.documentElement,n=r.getAttribute('data-theme')==='dark'?'light':'dark';r.setAttribute('data-theme',n);try{localStorage.setItem('cs-theme',n)}catch(_){}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#md').classList.contains('on'))shut();else document.body.classList.remove('nav')}});
window.addEventListener('hashchange',()=>{parse();render()});window.addEventListener('popstate',()=>{parse();render()});parse();render();

(function(){document.addEventListener('keydown',e=>{if(e.key==='/'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){const q=document.getElementById('q');if(q){e.preventDefault();q.focus()}}})})();
</script></body></html>
